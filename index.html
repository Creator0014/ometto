<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>おめっと</title>

    <style>
        html,
        body {
            margin: 0;

        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
        }

        .loading {
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 20px auto;

            border: 4px solid #eee;
            border-top-color: #06c755;
            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="loading">
    <div>おめっと</div>
    <div class="spinner"></div>
    <div>読み込んでいます…</div>
</div>

<script>
(function () {

    /*
     * Cloudflare Tunnel
     */
    const CLOUDFLARE =
        "https://dried-weapon-divide-job.trycloudflare.com";


    /*
     * ブラウザが現在開いているURL
     *
     * 例:
     *
     * https://ometto.onrender.com/card/card_vnw4yk4_1791074772739
     *
     * pathname:
     *
     * /card/card_vnw4yk4_1791074772739
     */
    const pathname =
        window.location.pathname;


    /*
     * ?以降
     */
    const search =
        window.location.search;


    /*
     * #以降
     */
    const hash =
        window.location.hash;


    /*
     * Cloudflare側へ渡すURL
     *
     * pathnameを必ずそのまま付ける。
     */
    const target =
        CLOUDFLARE +
        pathname +
        search +
        hash;


    /*
     * デバッグ
     */
    console.log("現在のURL:", window.location.href);
    console.log("pathname:", pathname);
    console.log("転送先:", target);


    /*
     * 転送
     */
    window.location.replace(target);

})();
</script>

</body>
</html>
