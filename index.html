<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // 転送先の Cloudflare URL（末尾のスラッシュは無し）
    const TARGET_URL = "https://dried-weapon-divide-job.trycloudflare.com";

    // ブラウザが開いている現在の「パス（/card/...）」と「クエリ（?foo=bar）」を取得
    const path = window.location.pathname;
    const search = window.location.search;

    // 転送先 URL を作成してリダイレクト
    window.location.replace(TARGET_URL + path + search);
  </script>
</head>
<body>
  <p>転送中...</p>
</body>
</html>
