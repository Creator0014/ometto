<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>おめっと</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            background: #f5f5f5;
            color: #333;
        }

        .loading {
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .message {
            color: #777;
        }

        .spinner {
            width: 32px;
            height: 32px;

            margin: 20px auto;

            border: 4px solid #e0e0e0;
            border-top-color: #06c755;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loading">

        <div class="logo">
            おめっと
        </div>

        <div class="spinner"></div>

        <div class="message">
            読み込んでいます…
        </div>

    </div>


    <script>

        // ==========================================
        // Cloudflare Tunnel
        // ==========================================

        const CLOUDFLARE_URL =
            "https://dried-weapon-divide-job.trycloudflare.com";


        // ==========================================
        // 現在のURLを取得
        // ==========================================

        const path =
            window.location.pathname;

        const search =
            window.location.search;

        const hash =
            window.location.hash;


        // ==========================================
        // 転送先URLを作成
        // ==========================================

        let target;


        /*
         * /
         *
         * → Cloudflare /
         */

        if (path === "/") {

            target =
                CLOUDFLARE_URL + "/";

        }


        /*
         * /card/xxxxx
         *
         * → Cloudflare /card/xxxxx
         */

        else if (path.startsWith("/card/")) {

            target =
                CLOUDFLARE_URL +
                path +
                search +
                hash;

        }


        /*
         * /card以外のURL
         *
         * 例:
         *
         * /test
         * /hello
         * /abc/123
         *
         * これらもそのままCloudflareへ
         */

        else {

            target =
                CLOUDFLARE_URL +
                path +
                search +
                hash;

        }


        // ==========================================
        // 転送
        // ==========================================

        console.log(
            "転送先:",
            target
        );


        window.location.replace(target);

    </script>

</body>
</html>
