<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おめっと</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        #status {
            font-weight: bold;
            margin-bottom: 8px;
        }
        #schedule {
            font-size: 0.9em;
            color: #666;
            margin-top: 0;
        }
        a {
            margin-top: 10px;
            color: #0066cc;
        }
    </style>
</head>

<body>
    <p id="status">接続を確認中...</p>
    <!-- 次の稼働時間を表示する要素 -->
    <p id="schedule"></p>
    <div id="link-container"></div>

    <script>
        const OLD_ORIGIN = "https://ometto.onrender.com";
        const NEW_ORIGIN = "https://dried-weapon-divide-job.trycloudflare.com";

        // ★ 次回の稼働時間をここに設定します
        const NEXT_SCHEDULE = "次回の稼働予定：17:00 〜 21:00"; 
        // ※「平日 18:00〜23:00」「土日祝 10:00〜20:00」のような表記でもOKです

        function getTargetUrl() {
            try {
                const currentUrl = new URL(window.location.href);
                return NEW_ORIGIN + currentUrl.pathname + currentUrl.search + currentUrl.hash;
            } catch (e) {
                return NEW_ORIGIN;
            }
        }

        const newUrl = getTargetUrl();

        async function tryRedirect() {
            const statusEl = document.getElementById('status');
            const scheduleEl = document.getElementById('schedule');
            const linkContainer = document.getElementById('link-container');

            // すでに新サーバーに接続されている場合
            if (window.location.origin === new URL(NEW_ORIGIN).origin) {
                statusEl.textContent = "すでに新しいサーバーに接続されています。";
                return;
            }

            // 5秒タイムアウト設定
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                await fetch(newUrl, { 
                    mode: 'no-cors',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                statusEl.textContent = "転送中...";
                window.location.href = newUrl;
            } catch (e) {
                clearTimeout(timeoutId);
                console.error("Redirect failed:", e);

                // 接続失敗時（稼働時間外）の表示
                statusEl.textContent = "サービス稼働時間外です（接続できません）";
                scheduleEl.textContent = NEXT_SCHEDULE; // 稼働時間を表示

                // 手動アクセス用リンク
                linkContainer.innerHTML = `<a href="${newUrl}">手動で接続を試みる</a>`;
            }
        }

        tryRedirect();
    </script>
</body>
</html>
