<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おめっと</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <p id="status">接続を確認中...</p>

    <script>
        const OLD_ORIGIN = "https://ometto.onrender.com";
        const NEW_ORIGIN = "https://simultaneously-ceramic-doubt-procurement.trycloudflare.com/"; // ※ドメインが変わったらここを変更

        function getTargetUrl() {
            try {
                const currentUrl = new URL(window.location.href);
                // 旧ドメインでアクセスされた場合、オリジン（プロトコル+ドメイン）だけを置換
                if (currentUrl.origin === OLD_ORIGIN) {
                    return NEW_ORIGIN + currentUrl.pathname + currentUrl.search + currentUrl.hash;
                }
                // すでに新ドメインにいる場合やローカル環境等の場合はそのまますすめる
                return currentUrl.href.replace(OLD_ORIGIN, NEW_ORIGIN);
            } catch (e) {
                return NEW_ORIGIN;
            }
        }

        const newUrl = getTargetUrl();
        console.log("Target URL:", newUrl);

        async function tryRedirect() {
            const statusEl = document.getElementById('status');

            // 無限リダイレクト防止
            if (window.location.href === newUrl) {
                statusEl.textContent = "すでに新しいURLにアクセスしています。";
                return;
            }

            // 5秒でタイムアウトするように設定
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                // 接続確認（CORS制限回避のため no-cors）
                await fetch(newUrl, { 
                    mode: 'no-cors',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                // 接続確認ができたらリダイレクト
                statusEl.textContent = "転送中...";
                window.location.href = newUrl;
            } catch (e) {
                clearTimeout(timeoutId);
                console.error("Redirect failed (service might be down or timed out):", e);
                statusEl.textContent = "サービス稼働時間外です（または接続できません）";
            }
        }

        tryRedirect();
    </script>
</body>
</html>
