<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // 転送先ベースURL（末尾にスラッシュをつけない）
    const TARGET_BASE_URL = "https://dried-weapon-divide-job.trycloudflare.com";

    // 現在の「パス（/card/...）」と「クエリ（?foo=bar）」をそのまま取得
    const path = window.location.pathname;
    const search = window.location.search;

    // 転送先URLを組み立てて即座に移動
    window.location.replace(TARGET_BASE_URL + path + search);
  </script>
</head>
<body>
  <p>転送中...</p>
</body>
</html>
