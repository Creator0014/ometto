<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>おめっと</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {

            display: flex;

            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            background: #ffffff;
            color: #333333;

        }

        .loading {

            text-align: center;

        }

        .logo {

            font-size: 32px;
            font-weight: 700;

            margin-bottom: 20px;

        }

        .message {

            font-size: 15px;
            color: #777777;

        }

        .spinner {

            width: 32px;
            height: 32px;

            margin: 20px auto;

            border: 4px solid #eeeeee;
            border-top-color: #06c755;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>


    <div class="loading">

        <div class="logo">
            おめっと
        </div>

        <div class="spinner"></div>

        <div class="message">
            読み込んでいます…
        </div>

    </div>


    <script>

        (() => {

            // ==================================================
            // Cloudflare Tunnel
            // ==================================================

            const CLOUDFLARE_URL =
                "https://dried-weapon-divide-job.trycloudflare.com";


            // ==================================================
            // 現在のURL
            // ==================================================

            const currentURL =
                window.location.href;


            console.log(
                "現在のURL:",
                currentURL
            );


            // ==================================================
            // ローカルで index.html を直接開いた場合
            //
            // file:///D:/LINEバースデーカード/公開URL/index.html
            //
            // この場合は / をCloudflareへ送る。
            // ==================================================

            if (
                window.location.protocol === "file:"
            ) {

                console.log(
                    "ローカルHTMLを検出しました。"
                );

                console.log(
                    "Cloudflareのルートへ移動します。"
                );


                window.location.replace(
                    CLOUDFLARE_URL + "/"
                );


                return;

            }


            // ==================================================
            // HTTP / HTTPSの場合
            // ==================================================

            const url =
                new URL(window.location.href);


            // ==================================================
            // パス
            // ==================================================

            let path =
                url.pathname;


            // ==================================================
            // クエリ
            //
            // 例:
            // ?user=123
            // ==================================================

            const search =
                url.search;


            // ==================================================
            // ハッシュ
            //
            // 例:
            // #open
            // ==================================================

            const hash =
                url.hash;


            console.log(
                "取得したパス:",
                path
            );


            console.log(
                "検索:",
                search
            );


            console.log(
                "ハッシュ:",
                hash
            );


            // ==================================================
            // Render側のRewriteによって
            //
            // /index.html
            //
            // になってしまった場合
            // ==================================================

            if (
                path === "/index.html"
            ) {

                /*
                 * Renderのトップページとして
                 * index.htmlになった場合は、
                 * Cloudflareのルートへ送る。
                 */

                path = "/";


                console.log(
                    "/index.html → / に変換しました。"
                );

            }


            // ==================================================
            // 最終転送先
            // ==================================================

            const target =
                CLOUDFLARE_URL +
                path +
                search +
                hash;


            // ==================================================
            // デバッグ
            // ==================================================

            console.log(
                "--------------------------------"
            );

            console.log(
                "最終転送先:",
                target
            );

            console.log(
                "--------------------------------"
            );


            // ==================================================
            // Cloudflareへ転送
            // ==================================================

            window.location.replace(
                target
            );


        })();

    </script>


</body>

</html>
